upstream habit_app {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    location /static/ {
        root /app/static/;
    }

    location /media/ {
        root /app/media/;
    }

    location / {
        proxy_pass http://habit_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}