upstream habit_app {
    server app:8000;
}

server {
    # Слушаем 80 порт
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Обслуживание статики (если настроено)
     location /static/ {
         alias /app/static/; # путь внутри контейнера app
     }

     # Обслуживание медиа (если настроено)
     location /media/ {
         alias /app/media; # путь внутри контейнера app
     }

    # Проксирование всех остальных запросов к приложению Django/Gunicorn
    location / {
        proxy_pass http://habit_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}