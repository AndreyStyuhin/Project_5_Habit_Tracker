
services:
  db:
    image: postgres:15-alpine
    container_name: habit_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habit_net

  redis:
    image: redis:7-alpine
    container_name: habit_redis
    restart: always
    networks:
      - habit_net

  app:
    # ИСПРАВЛЕНО: Заменено 'image:' на 'build:' для локальной сборки
    image: 212.22.70.98:5000/habit_tracker/app:latest
    container_name: habit_app
    restart: always
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/static
    expose:
      - "8000"
    # ИСПРАВЛЕНО: 'config.wsgi' -> 'habit_tracker.wsgi'
    command: >
      sh -c "gunicorn habit_tracker.wsgi:application --bind 0.0.0.0:8000"
    networks:
      - habit_net

  nginx:
    # ИСПРАВЛЕНО: Заменено 'image:' на 'build:'
    image: 212.22.70.98:5000/habit_tracker/nginx:latest
    container_name: habit_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - static_volume:/static
    networks:
      - habit_net

  # ДОБАВЛЕНО: Сервис Celery Worker
  celery:
    image: 212.22.70.98:5000/habit_tracker/app:latest
    container_name: habit_celery
    restart: always
    env_file: .env
    command: >
      sh -c "celery -A habit_tracker worker -l info"
    depends_on:
      - app
      - redis
      - db
    networks:
      - habit_net
    environment:
      - SKIP_MIGRATE=true

  # ДОБАВЛЕНО: Сервис Celery Beat (Планировщик)
  celery-beat:
    image: 212.22.70.98:5000/habit_tracker/app:latest
    container_name: habit_beat
    restart: always
    env_file: .env
    command: >
      sh -c "celery -A habit_tracker beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - app
      - redis
      - db
    networks:
      - habit_net
    environment:
      - SKIP_MIGRATE=true

volumes:
  postgres_data:
  static_volume:

networks:
  habit_net:
    driver: bridge