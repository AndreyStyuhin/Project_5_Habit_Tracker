version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: habit_db
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Брокер сообщений Redis
  redis:
    image: redis:7-alpine
    container_name: habit_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django-приложение (Gunicorn)
  app:
    build: .
    container_name: habit_app
    env_file:
      - ./.env
    command: gunicorn habit_tracker.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000" # Временно для отладки, Nginx будет основным
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # Celery Worker
  celery:
    build: .
    container_name: habit_celery_worker
    command: celery -A habit_tracker worker -l info
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - app
      - redis
    restart: on-failure

  # Celery Beat (Планировщик)
  celery-beat:
    build: .
    container_name: habit_celery_beat
    command: celery -A habit_tracker beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - app
      - redis
    restart: on-failure

  # Веб-сервер Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: habit_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - app
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: