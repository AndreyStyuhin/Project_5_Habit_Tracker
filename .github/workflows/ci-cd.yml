name: CI/CD Pipeline

on:
  push:
    branches:
      - Course_9_The_final_task_Dell
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations and tests
        env:
          SECRET_KEY: test_key
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py test

  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure Docker registry
        run: |
          echo '{ "insecure-registries":["212.22.70.98:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to private Docker registry
        uses: docker/login-action@v3
        with:
          registry: 212.22.70.98:5000
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Django app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/nginx:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/Course_9_The_final_task_Dell' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 25m
          script: |
            set -e
            cd /srv/habit_tracker

            echo "===> Ensuring swap is active"
            sudo swapon --show || sudo swapon /swapfile || true

            echo "===> Updating code"
            git pull origin Course_9_The_final_task_Dell || true

            echo "===> Recreating .env"
            cat <<EOF > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=127.0.0.1,localhost,212.22.70.98
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EOF

            echo "===> Pulling latest Docker images"
            docker compose pull

            echo "===> Starting only DB and Redis first"
            docker compose up -d db redis
            sleep 10

            echo "===> Running migrations in isolated container"
            docker compose run --rm app python manage.py migrate --noinput
            echo "===> Collecting static files safely (with permission fix)"
            docker compose run --rm --user root app sh -c "
            echo 'Cleaning old static files...' &&
            rm -rf /app/static/* &&
            mkdir -p /app/static &&
            chown -R 1000:1000 /app/static &&
            su -s /bin/sh -c 'python manage.py collectstatic --noinput --clear --verbosity 0' appuser || \
            su -s /bin/sh -c 'python manage.py collectstatic --noinput --clear --verbosity 0' www-data || \
            python manage.py collectstatic --noinput --clear --verbosity 0"



            echo "===> Restarting all services"
            docker compose up -d app nginx celery celery-beat

            echo "===> Cleaning unused Docker images"
            docker image prune -f

            echo "===> Verifying deployment..."
            sleep 5
            VERIFICATION_COMMAND="docker compose exec -T nginx sh -c \"apk add --no-cache curl >/dev/null 2>&1 || true && curl -s -o /dev/null -w '%{http_code}' http://localhost\" | grep -q '200'"
            if eval $VERIFICATION_COMMAND; then
              echo '✅ Deployment verified successfully'
            else
              echo '❌ Deployment verification failed!'
              docker compose logs app -n 50
              exit 1
            fi

