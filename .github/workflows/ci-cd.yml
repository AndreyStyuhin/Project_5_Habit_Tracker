name: CI/CD Pipeline

on:
  push:
    branches:
      - Course_9_The_final_task_Dell
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations and tests
        env:
          SECRET_KEY: test_key
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py test

  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure Docker registry
        run: |
          echo '{ "insecure-registries":["212.22.70.98:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to private Docker registry
        uses: docker/login-action@v3
        with:
          registry: 212.22.70.98:5000
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Django app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/nginx:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/Course_9_The_final_task_Dell' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 25m
          script: |
            set -e
            cd /srv/habit_tracker

            echo "===> Ensuring swap is active"
            sudo swapon --show || sudo swapon /swapfile || true

            echo "===> Updating code"
            git pull origin Course_9_The_final_task_Dell || true

            echo "===> Recreating .env"
            cat <<EOF > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=127.0.0.1,localhost,212.22.70.98
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EOF
            
            # Удаляет все остановленные контейнеры
            docker container prune -f
            
            # Удаляет все неиспользуемые образы
            docker image prune -a -f
            
            # Удаляет все неиспользуемые volume
            docker volume prune -f
            # Удаляет все неиспользуемые сети
            docker network prune -f
            
            echo "===> Pulling latest Docker images"
            docker compose pull
            
            echo "===> Starting only DB and Redis first"
            docker compose up -d db redis
            sleep 10
            
            echo "===> Ensuring correct permissions on static/ media directories"
            # Run chown BEFORE migrate to ensure the non-root 'app' user can operate
            docker compose run --rm --user root app sh -c "mkdir -p /app/static /app/media && chown -R 1000:1000 /app/static /app/media && chmod -R 755 /app/static /app/media"
            
            echo "===> Running migrations in isolated container"
            docker compose run --rm app python manage.py migrate --noinput
            
            echo "===> Preparing static files safely"
            # Использовать find для безопасного удаления ВСЕГО содержимого, исключая точки монтирования
            docker compose run --rm --user root app find /app/static -mindepth 1 -delete
            
            # Собираем статику под root
            docker compose run --rm --user root app python manage.py collectstatic --noinput --clear --verbosity 0
            
            # Выставляем права на папку для обычного пользователя приложения (uid=1000)
            docker compose run --rm --user root app sh -c "chown -R 1000:1000 /app/static && chmod -R 755 /app/static"
            
            echo "===> Restarting all services"
            docker compose up -d app nginx celery celery-beat
            
            echo "===> Cleaning unused Docker images"
            docker image prune -f
            
            echo "===> Verifying deployment (FINAL ATTEMPT)..."
            
            # Увеличиваем задержку до 30 секунд для максимальной надежности
            sleep 30
            # КОМАНДА ДЛЯ ПОЛУЧЕНИЯ HTTP-КОДА
            GET_CODE_COMMAND="docker compose exec -T nginx sh -c 'apk add --no-cache curl >/dev/null 2>&1 || true && curl -s -o /dev/null -w %{http_code} http://localhost'"
            
            # Выполняем команду, сохраняем результат, и принудительно игнорируем ошибку (|| true)
            set +e # Отключаем set -e
            HTTP_CODE=$(eval "$GET_CODE_COMMAND" 2>/dev/null || true)
            set -e # Включаем set -e обратно
            
            # Проверка результата
            if echo "$HTTP_CODE" | grep -qE "^200$|^301$|^302$"; then
            echo '✅ Deployment verified successfully (Code: '$HTTP_CODE')'
            echo "HTTP CODE: $HTTP_CODE"
            else
            echo '❌ Deployment verification failed!'
            echo "--- Diagnostic output ---"
            echo "EXPECTED HTTP CODE 200, RECEIVED: $HTTP_CODE"
            echo '--- App Container Logs (last 50 lines) ---'
            docker compose logs app -n 50
            exit 1
            fi