name: CI/CD Pipeline (Lint, Test, Build, Deploy)

on:
  push:
    branches:
      - Course_9_The_final_task  # Деплой при пуше
  pull_request:
    branches:
      - [cite_start]develop # Проверки при PR в develop [cite: 164]

jobs:
  # --- 1. Линтинг и Тесты ---
  lint_and_test:
    name: Linting & Testing
    runs-on: ubuntu-latest

    services:
      # Запуск сервисов для тестов
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 3. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8  # Убедимся, что flake8 есть [cite: 129]

      - name: 4. Run Linting (Flake8)
        run: flake8 . --exclude=*/migrations/*,venv/

      - name: 5. Run Tests (Pytest)
        env:
          # Переменные для подключения к сервисам БД и Redis
          SECRET_KEY: test_secret_key
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest --cov=. [cite_start]--cov-report=xml # [cite: 128]

  # --- 2. Проверка сборки Docker ---
  build_check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint_and_test # Запускать после тестов

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Check Docker Compose build
        run: |
          # Создаем .env для сборки, он не будет использоваться,
          # но docker-compose build может его требовать
          cp .env.example .env
          docker-compose build app

  # --- 3. Деплой на Сервер ---
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [lint_and_test, build_check] # Запускать после тестов и проверки сборки
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Только при пуше в main

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Copy .env configuration
        run: |
          # Создаем .env файл из GitHub Secrets
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "DEBUG=${{ secrets.DEBUG }}" >> .env
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
          echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

      - name: 3. SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Переходим в директорию проекта на сервере
            cd /путь/к/вашему/проекту/Project_5_Habit_Tracker
            
            # Получаем последние изменения из репозитория
            git pull origin main
            
            # Копируем .env файл, созданный на шаге 2, на сервер
            # (Этот шаг требует настройки 'scp' или использования другого метода
            # В appleboy/ssh-action@master можно использовать scp
            # Но проще всего создать .env на сервере вручную один раз,
            # а в GHA передавать только те, что нужны для сборки.)

            # --- Альтернативный, более безопасный способ ---
            # 1. SSH-подключение для обновления кода
            # 2. Создание .env файла на сервере из secrets
            
            cd /home/${{ secrets.SERVER_USERNAME }}/Project_5_Habit_Tracker
            git pull origin main
            
            # Создаем .env файл на сервере из secrets
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},www.${{ secrets.SERVER_HOST }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_HOST=db" >> .env
            echo "POSTGRES_PORT=5432" >> .env
            echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
            echo "CELERY_RESULT_BACKEND=redis://redis:6379/0" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            
            # Пересобираем и перезапускаем контейнеры [cite: 159]
            docker-compose up -d --build
            
            # Применяем миграции (только для 'app' контейнера)
            docker-compose exec -T app python manage.py migrate
            
            # Собираем статику (только для 'app' контейнера)
            docker-compose exec -T app python manage.py collectstatic --no-input
            
            # Очистка старых образов (опционально)
            docker image prune -f