# --- 3. Деплой на сервер ---
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/Course_9_The_final_task_Dell' && github.event_name == 'push'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # ИСПРАВЛЕННЫЙ БЛОК:
          script: |
            set -e
            cd /srv/habit_tracker

            echo "===> Pulling latest code"
            git pull origin Course_9_The_final_task_Dell || true

            echo "===> Creating .env file"
            cat > .env << 'EOF'
SECRET_KEY=${{ secrets.SECRET_KEY }}
DEBUG=False
ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }},127.0.0.1,localhost,212.22.70.98

POSTGRES_DB=${{ secrets.POSTGRES_DB }}
POSTGRES_USER=${{ secrets.POSTGRES_USER }}
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
POSTGRES_HOST=db
POSTGRES_PORT=5432

CELERY_BROKER_URL=redis://redis:6379/0
CELERY_RESULT_BACKEND=redis://redis:6379/0
TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
EOF

            echo "===> Pulling updated Docker images"
            docker compose pull

            echo "===> Restarting containers"
            docker compose up -d --force-recreate

            echo "===> Waiting for PostgreSQL..."
            until docker compose exec -T db pg_isready -U ${{ secrets.POSTGRES_USER }} > /dev/null 2>&1; do
              sleep 2
            done

            echo "===> Applying Django migrations"
            docker compose exec -T app python manage.py migrate --noinput

            echo "===> Collecting static files"
            docker compose exec -T app python manage.py collectstatic --noinput

            echo "===> Cleaning up old Docker images"
            docker image prune -f

            echo "===> Verifying deployment..."
            sleep 5
            # ИСПРАВЛЕННАЯ СТРОКА (предположительно, была слишком длинной и содержала конфликтующие символы):
            VERIFICATION_COMMAND='docker compose exec -T nginx sh -c "apk add --no-cache curl >/dev/null 2>&1 || true && curl -s -o /dev/null -w \047%{http_code}\047 http://localhost" | grep -q "200"'
            if eval $VERIFICATION_COMMAND; then
              echo '✅ Deployment verified successfully'
            else
              echo '❌ Deployment verification failed!'
              exit 1
            fi