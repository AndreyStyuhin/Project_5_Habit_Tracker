name: CI/CD Pipeline (Lint, Test, Build, Push, Deploy)

on:
  push:
    branches:
      - Course_9_The_final_task_Dell  # триггер деплоя при пуше в эту ветку
  pull_request:
    branches:
      - develop  # проверки при PR в develop

jobs:
  # --- 1. Линтинг и Тесты ---
  lint_and_test:
    name: Linting & Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run Linting
        run: flake8 . --exclude=*/migrations/*,venv/

      - name: Run Tests
        env:
          SECRET_KEY: test_secret_key
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest


  # --- 2. Сборка и пуш образа в локальный Registry ---
  build_and_push:
    name: Build & Push Docker Image to Local Registry
    runs-on: ubuntu-latest
    needs: lint_and_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Важно! Разрешаем небезопасный реестр ---
      - name: Configure Docker daemon for insecure registry
        run: |
          echo '{ "insecure-registries": ["212.22.70.98:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # --- Логинимся в registry (если есть логин/пароль) ---
      - name: Login to local Docker Registry
        run: |
          docker login 212.22.70.98:5000 -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASS }}

      - name: Build and push image
        run: |
          IMAGE_NAME=212.22.70.98:5000/habit_app:latest
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Verify pushed image
        run: curl -s http://212.22.70.98:5000/v2/_catalog


  # --- 3. Деплой на сервер ---
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "→ Pulling new Docker image from registry..."
            docker pull 212.22.70.98:5000/habit_app:latest

            echo "→ Updating project containers..."
            cd /home/${{ secrets.SERVER_USERNAME }}/Project_5_Habit_Tracker

            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},www.${{ secrets.SERVER_HOST }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_HOST=db" >> .env
            echo "POSTGRES_PORT=5432" >> .env
            echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
            echo "CELERY_RESULT_BACKEND=redis://redis:6379/0" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

            docker-compose pull app
            docker-compose up -d --build

            docker-compose exec -T app python manage.py migrate
            docker-compose exec -T app python manage.py collectstatic --no-input

            docker image prune -f
