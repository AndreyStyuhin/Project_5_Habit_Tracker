name: CI/CD Pipeline (Test, Build & Deploy)

on:
  push:
    branches:
      - Course_9_The_final_task_Dell  # <-- ветка для деплоя
  pull_request:
    branches:
      - develop  # <-- только проверки при PR в develop

jobs:
  # --- 1. Тестирование ---
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Django tests
        env:
          SECRET_KEY: test_key
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py test

  # --- 2. Сборка и публикация Docker образов ---
  build_and_push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Allow insecure Docker registry
        run: |
          echo '{ "insecure-registries":["212.22.70.98:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 3. Login to private Docker registry
        uses: docker/login-action@v3
        with:
          registry: 212.22.70.98:5000
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 4. Build and push Django app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/app:latest

      - name: 5. Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: 212.22.70.98:5000/habit_tracker/nginx:latest

  # --- 3. Деплой на сервер ---
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/Course_9_The_final_task_Dell' && github.event_name == 'push'

    steps:
      - name: 1. SSH Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /srv/habit_tracker

            echo "===> Pulling latest code"
            git pull origin Course_9_The_final_task_Dell || true

            echo "===> Creating .env file"
            cat > .env <<EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},127.0.0.1,localhost
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EOF

            echo "===> Updating Docker images"
            docker-compose pull
            docker-compose up -d --build

            echo "===> Running migrations & collecting static files"
            docker-compose exec -T app python manage.py migrate --noinput
            docker-compose exec -T app python manage.py collectstatic --noinput

            echo "===> Cleaning up old images"
            docker image prune -f
