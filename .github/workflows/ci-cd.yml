      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 20m
          script: |
            set -e
            cd /srv/habit_tracker

            echo "===> Ensuring swap is active"
            sudo swapon --show || sudo swapon /swapfile || true

            echo "===> Updating code"
            git pull origin Course_9_The_final_task_Dell || true

            echo "===> Recreating .env"
            cat <<EOF > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=127.0.0.1,localhost,212.22.70.98
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EOF

            echo "===> Pulling latest Docker images"
            docker compose pull

            echo "===> Starting only core containers (db, redis, app, nginx)"
            docker compose up -d db redis app nginx
            sleep 10

            echo "===> Waiting for PostgreSQL..."
            until docker compose exec -T db pg_isready -U ${{ secrets.POSTGRES_USER }} > /dev/null 2>&1; do
              sleep 2
            done

            echo "===> Running migrations"
            docker compose exec -T app python manage.py migrate --noinput || {
              echo "⚠️ Migrate failed - retrying with swap check"
              sudo swapon --show
              docker compose restart db
              sleep 10
              docker compose exec -T app python manage.py migrate --noinput
            }

            echo "===> Collecting static files"
            docker compose exec -T app python manage.py collectstatic --noinput

            echo "===> Now starting Celery services"
            docker compose up -d celery celery-beat

            echo "===> Cleaning up old Docker images"
            docker image prune -f

            echo "===> Verifying deployment..."
            sleep 5
            VERIFICATION_COMMAND="docker compose exec -T nginx sh -c \"apk add --no-cache curl >/dev/null 2>&1 || true && curl -s -o /dev/null -w '%{http_code}' http://localhost\" | grep -q '200'"
            if eval $VERIFICATION_COMMAND; then
              echo '✅ Deployment verified successfully'
            else
              echo '❌ Deployment verification failed!'
              docker compose logs app -n 50
              exit 1
            fi
