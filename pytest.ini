[pytest]
DJANGO_SETTINGS_MODULE = habit_tracker.settings
python_files = tests_*.py *_tests.py

# Убрали: --cov-exclude=...
addopts =
    --cov=.
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=80

[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv/,
    env/