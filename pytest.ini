[pytest]
DJANGO_SETTINGS_MODULE = habit_tracker.settings
python_files = tests.py test_*.py *_tests.py

addopts =
    --cov=.
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=80
    --cov-exclude=*/migrations/*,*/settings.py,*/wsgi.py,*/asgi.py,manage.py,*/__init__.py,*/admin.py,*/apps.py

[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv/,
    env/